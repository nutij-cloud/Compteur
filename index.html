<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avant de se revoir 😉❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-bottom: 24px;
        }
        /* Écran question d'accès */
        .quiz-question {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 18px;
            line-height: 1.4;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
            text-align: left;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.2);
            padding: 13px 15px;
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: background 0.2s ease, transform 0.15s ease;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .option-item:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .option-item input[type="radio"] {
            accent-color: #ffffff;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .btn-unlock {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #ffffff;
            color: #ff5e7e;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }
        .btn-unlock:active {
            transform: scale(0.98);
        }
        .error-msg {
            margin-top: 12px;
            font-size: 0.88rem;
            color: #fff0f3;
            background: rgba(160, 0, 40, 0.35);
            padding: 10px 12px;
            border-radius: 12px;
            display: none;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            75% { transform: translateX(7px); }
        }
        .shake {
            animation: shake 0.3s ease;
        }
        /* Compteur */
        #counter-view {
            display: none;
        }
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        .time-box {
            background: rgba(255, 255, 255, 0.22);
            padding: 15px 5px;
            border-radius: 16px;
        }
        .number {
            display: block;
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.1;
        }
        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.85;
            margin-top: 4px;
            display: block;
        }
        /* Compteur visuel (Barre de progression) */
        .progress-wrapper {
            margin-bottom: 24px;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            opacity: 0.9;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .progress-track {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            position: relative;
            padding: 2px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffe3e8 0%, #ffffff 100%);
            border-radius: 999px;
            transition: width 0.6s ease;
            position: relative;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }
        .progress-heart {
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .message {
            font-size: 1rem;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.12);
            padding: 15px;
            border-radius: 14px;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <!-- Écran d'accès par question -->
        <div id="gate-view">
            <h1>Accès privé ❤️</h1>
            <p class="subtitle">Prouve que c'est bien toi (même si les autres connaissent notre date...)</p>

            <p class="quiz-question">Quelle est la date de notre relation ?</p>

            <form id="quiz-form">
                <div class="options-list">
                    <label class="option-item">
                        <input type="radio" name="relationDate" value="29 juillet 2025">
                        <span>29 juillet 2025</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="relationDate" value="28 juillet 2024">
                        <span>28 juillet 2024</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="relationDate" value="28 juillet 2025">
                        <span>28 juillet 2025</span>
                    </label>
                </div>

                <button type="submit" class="btn-unlock">Valider</button>
            </form>

            <p class="error-msg" id="error-msg">Tu es sérieuse ?😒</p>
        </div>

        <!-- Vue du compteur une fois débloqué -->
        <div id="counter-view">
            <h1>Bientôt ensemble ❤️</h1>
            <p class="subtitle">Vendredi 27 novembre à 20h00</p>

            <div class="countdown" id="countdown">
                <div class="time-box">
                    <span class="number" id="days">0</span>
                    <span class="label">Jours</span>
                </div>
                <div class="time-box">
                    <span class="number" id="hours">00</span>
                    <span class="label">Heures</span>
                </div>
                <div class="time-box">
                    <span class="number" id="minutes">00</span>
                    <span class="label">Min</span>
                </div>
                <div class="time-box">
                    <span class="number" id="seconds">00</span>
                    <span class="label">Sec</span>
                </div>
            </div>

            <div class="progress-wrapper" id="progress-wrapper">
                <div class="progress-header">
                    <span>Progression</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill">
                        <span class="progress-heart">🥰</span>
                    </div>
                </div>
            </div>

            <p class="message" id="status-msg">Courage, le plus gros est déjà derrière nous !</p>
        </div>
    </div>

    <script>
        const CORRECT_ANSWER = "28 juillet 2024";
        const quizForm = document.getElementById("quiz-form");
        const errorMsg = document.getElementById("error-msg");
        const gateView = document.getElementById("gate-view");
        const counterView = document.getElementById("counter-view");
        const mainCard = document.getElementById("main-card");

        quizForm.addEventListener("submit", function(e) {
            e.preventDefault();
            const selected = document.querySelector('input[name="relationDate"]:checked');

            if (!selected) {
                errorMsg.innerText = "Coche une réponse d'abord 😉";
                errorMsg.style.display = "block";
                return;
            }

            if (selected.value === CORRECT_ANSWER) {
                errorMsg.style.display = "none";
                gateView.style.display = "none";
                counterView.style.display = "block";
                updateTimer();
            } else {
                errorMsg.innerText = "Pas tout à fait, essaie une autre date !";
                errorMsg.style.display = "block";
                mainCard.classList.remove("shake");
                void mainCard.offsetWidth;
                mainCard.classList.add("shake");
            }
        });

        // Point de départ (Lundi 9 nov 2026 à 10h00) et arrivée (Vendredi 27 nov 2026 à 20h00)
        const startDate = new Date("2026-11-09T10:00:00").getTime();
        const targetDate = new Date("2026-11-27T20:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const totalDuration = targetDate - startDate;
            const elapsed = now - startDate;

            if (distance <= 0) {
                document.getElementById("countdown").style.display = "none";
                document.getElementById("progress-fill").style.width = "100%";
                document.getElementById("progress-percent").innerText = "100%";
                document.getElementById("status-msg").innerHTML = "🎉 <strong>C'est l'heure ! On se retrouve enfin ❤️</strong>";
                return;
            }

            // Calcul de la barre de progression
            let percentage = (elapsed / totalDuration) * 100;
            percentage = Math.max(0, Math.min(100, percentage));
            document.getElementById("progress-fill").style.width = percentage.toFixed(2) + "%";
            document.getElementById("progress-percent").innerText = Math.floor(percentage) + "%";

            // Calcul du décompte
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
    </script>

</body>
</html>
